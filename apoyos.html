<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMAS DE APOYOS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F5F3EE;
      --surface: #FFFFFF;
      --surface2: #F0EDE6;
      --accent: #2D5BE3;
      --accent-light: #EBF0FF;
      --accent-dark: #1A3BAD;
      --text: #1A1917;
      --text-mid: #5C5A55;
      --text-muted: #9B9890;
      --border: #E2DED6;
      --border-strong: #C8C4BB;
      --check-size: 17px;
      --radius: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .page-header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 640px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header span {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-mid);
    }

    .count-pill {
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      font-family: 'DM Mono', monospace;
      transition: all 0.2s;
    }

    .items-list {
      max-height: 72vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .items-list::-webkit-scrollbar {
      width: 4px;
    }

    .items-list::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item:hover {
      background: #FAFAF7;
    }

    .item.checked {
      background: var(--accent-light);
    }

    .item.checked:hover {
      background: #E0E9FF;
    }

    .checkbox {
      width: var(--check-size);
      height: var(--check-size);
      border: 1.5px solid var(--border-strong);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      background: var(--surface);
    }

    .item.checked .checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkmark {
      width: 9px;
      height: 7px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.15s;
    }

    .item.checked .checkmark {
      opacity: 1;
      transform: scale(1);
    }

    .item-num {
      font-size: 11px;
      font-weight: 500;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      min-width: 20px;
      padding-top: 3px;
      flex-shrink: 0;
    }

    .item.checked .item-num {
      color: var(--accent);
    }

    .item-text {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.55;
      flex: 1;
    }

    .output-panel {
      position: sticky;
      top: 1rem;
    }

    .output-area {
      padding: 14px 16px;
      min-height: 200px;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      border: none;
      outline: none;
      resize: vertical;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      line-height: 1.65;
      scrollbar-width: thin;
    }

    .placeholder-msg {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.6;
    }

    .output-actions {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-mid);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .copy-confirm {
      font-size: 12px;
      color: #1A9A5C;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-confirm.show {
      opacity: 1;
    }

    .select-all-bar {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .link-btn {
      font-size: 12px;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      padding: 0;
      font-weight: 500;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .sep {
      color: var(--border-strong);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="page-header">
      <h1>ING. ORANGE</h1>
      <p>Selecciona las opciones y copia el texto generado.</p>
    </div>

    <div class="layout">
      <!-- Lista de ítems -->
      <div class="panel">
        <div class="panel-header">
          <span>Opciones</span>
          <div class="count-pill" id="countPill">0 / 34</div>
        </div>
        <div class="select-all-bar">
          <button class="link-btn" onclick="selectAll()">Seleccionar todo</button>
          <span class="sep">·</span>
          <button class="link-btn" onclick="clearAll()">Limpiar</button>
        </div>
        <div class="items-list" id="itemsList"></div>
      </div>

      <!-- Panel de salida -->
      <div class="panel output-panel">
        <div class="panel-header">
          <span>Texto generado</span>
        </div>
        <div class="output-area" id="outputArea">
          <p class="placeholder-msg" id="placeholder">Selecciona una o más opciones de la lista para ver el texto aquí.
          </p>
          <textarea id="outputText" style="display:none;"></textarea>
        </div>
        <div class="output-actions">
          <button class="btn btn-primary" onclick="copyText()">Copiar texto</button>
          <button class="btn" onclick="clearAll()">Limpiar selección</button>
          <span class="copy-confirm" id="copyConfirm">¡Copiado!</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const opciones = [
      "Realizar ejercicios de lectura de comprensión",
      "Realizar ejercicios de interpretación de textos",
      "Practicar la escritura en casa",
      "Practicar en casa la lectura en voz alta durante 20 minutos para manejar su fluidez.",
      "Realizar resumen de textos apoyado por su familia",
      "Practicar las expresiones orales ante otras personas",
      "Aprender a trabajar en equipo",
      "Participar en las ceremonias cívicas y mostrar respeto al momento de la entonación del Himno Nacional",
      "Practicar valores de convivencia con los demás tales como respeto, la amistad, el compañerismo, etc.",
      "Realizar actividades prácticas de lo aprendido en la asignatura. (sugerir al padre qué actividad debe realizar su hijo en casa)",
      "Cumplir con las tareas escolares.",
      "Consultar y utilizar fuentes de información (libros, internet, revistas especializadas, etc.) supervisado por el padre, madre o tutor al realizar las tareas escolares.",
      "Practicar la resolución de problemas de la vida diaria relacionados con la asignatura.",
      "Fomentar en el alumno horario de estudio en casa, supervisado por el padre, madre o tutor.",
      "Practicar en casa operaciones matemáticas",
      "Realizar ejercicios de razonamiento",
      "Asistir diaria y puntualmente a Clases",
      "Investigación de temas de la asignatura a través del uso de la tecnología.",
      "Administrar el uso de los medios electrónicos",
      "Realizar en casa actividades que fortalezcan su autoestima",
      "Interactuar con compañeros de necesidades educativas especiales (NEE)",
      "Requiere atención especializada (acercarse al área de orientación o tutoría de la Escuela)",
      "Apoyarse en programas educativos (becas, uniforme, ver bien para aprender mejor, etc.)",
      "Participar en actividades recreativas, artísticas, culturales y deportivas.",
      "Cuidar la higiene",
      "Cuidar la alimentación",
      "Cuidar la salud",
      "Asistir a clases de asesoría",
      "Asistir a clases con útiles escolares y material requerido por el profesor de la asignatura",
      "Participar en actividades del cuidado ambiental",
      "Participar en la organización de campañas y actividades culturales extraescolares.",
      "Motivar al alumno para que asista a cursos de regularización académica extra clase",
      "Reconocer el papel de la escuela y su importancia en proyecto de vida",
      "Es necesario que el padre, madre o tutor asista a la escuela a recibir información de su hijo"
    ];

    const selected = new Set();

    function renderList() {
      const list = document.getElementById('itemsList');
      list.innerHTML = '';
      opciones.forEach((texto, i) => {
        const num = i + 1;
        const div = document.createElement('div');
        div.className = 'item' + (selected.has(i) ? ' checked' : '');
        div.innerHTML = `
      <div class="checkbox">
        <svg class="checkmark" viewBox="0 0 9 7" fill="none">
          <polyline points="1,3.5 3.5,6 8,1" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="item-num">${String(num).padStart(2, '0')}</div>
      <div class="item-text">${texto}</div>
    `;
        div.addEventListener('click', () => toggle(i));
        list.appendChild(div);
      });
    }

    function toggle(i) {
      if (selected.has(i)) selected.delete(i);
      else selected.add(i);
      updateUI();
    }

    function updateUI() {
      document.querySelectorAll('.item').forEach((el, i) => {
        el.classList.toggle('checked', selected.has(i));
      });
      document.getElementById('countPill').textContent = `${selected.size} / 34`;

      const sorted = [...selected].sort((a, b) => a - b);
      const lines = sorted.map(i => opciones[i]).join('. ');

      const placeholder = document.getElementById('placeholder');
      const ta = document.getElementById('outputText');

      if (selected.size === 0) {
        placeholder.style.display = '';
        ta.style.display = 'none';
      } else {
        placeholder.style.display = 'none';
        ta.style.display = '';
        ta.value = lines;
      }
    }

    function selectAll() {
      opciones.forEach((_, i) => selected.add(i));
      updateUI();
    }

    function clearAll() {
      selected.clear();
      updateUI();
    }

    function copyText() {
      const ta = document.getElementById('outputText');
      if (!ta.value) return;
      navigator.clipboard.writeText(ta.value).then(() => {
        const msg = document.getElementById('copyConfirm');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2000);
      });
    }

    renderList();
  </script>
</body>

</html>
